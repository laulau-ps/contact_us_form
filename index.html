<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Estilo Moderno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="content">
            <figure class="image-box">
                <img src="contact.png" alt="Ilustração de contato">
            </figure>

            <form action="#">
                <h2 class="topic">Envie uma mensagem</h2>
                
                <div class="input-box">
                    <input type="text" id="user-name" required>
                    <label for="user-name">Digite seu nome</label>
                </div>

                <div class="input-box">
                    <input type="email" id="user-email" required>
                    <label for="user-email">Digite seu e-mail</label>
                </div>

                <div class="message-box">
                    <textarea id="user-msg" required></textarea>
                    <label for="user-msg">Digite sua mensagem</label>
                </div>

                <button type="submit" class="send-btn">Enviar Mensagem</button>
            </form>
        </section>
    </main>

</body>
</html>
